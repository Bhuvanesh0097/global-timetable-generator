services:
  - type: web
    name: global-timetable-generator
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 24.19.0